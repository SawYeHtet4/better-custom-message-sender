AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31

Description: AWS Cognito Custom Message Sender Lambda Function (SMS Only)

Globals:
  Function:
    Timeout: 60
    Runtime: go1.x
    Environment:
      Variables:
        APP: ""
        VERSION: ""
        ENV: ""
        SMS_HOST: ""
        SMS_AUTH_KEY: ""
        KEY_ID: ""

Resources:
  CustomMessageSenderFunction:
    Type: AWS::Serverless::Function
    Properties:
      Description: "Cognito Custom Message Sender for SMS"
      CodeUri: cmd/function/message_sender/
      Handler: main
